cargo-features = ["per-package-target"]

[package]
name = "kernel"
version = "0.1.0"
edition = "2024"
# The kernel only makes sense for bare metal, even with `cargo build -p kernel`.
forced-target = "x86_64-unknown-none"

[[bin]]
name = "kernel"
test = false
bench = false

[dependencies]
bootloader_api = "0.11.17"
spin = "0.12.3"
uart_16550 = "0.9.0"
x86_64 = "0.15.5"
